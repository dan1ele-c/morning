<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Morning">
<meta name="theme-color" content="#1d3557">
<title>Morning</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☀️</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='%232F6FD6'/><stop offset='1' stop-color='%2389C2F0'/></linearGradient></defs><rect width='180' height='180' fill='url(%23g)'/><circle cx='90' cy='96' r='36' fill='%23FFD36E'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --sky1:#2F6FD6; --sky2:#89C2F0; --glow:rgba(255,214,110,.55);
  --ink:#fff; --soft:rgba(255,255,255,.72); --faint:rgba(255,255,255,.45);
  --glass:rgba(255,255,255,.13); --glass-edge:rgba(255,255,255,.24); --line:rgba(255,255,255,.16);
  --good:#6CF0A8; --warn:#FFD36E; --bad:#FF7A7A;
  --num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Manrope",-apple-system,"Segoe UI",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{color:var(--ink);font:500 16px/1.45 var(--body);-webkit-font-smoothing:antialiased;background:var(--sky1)}
img{display:block}
:focus-visible{outline:2px solid #fff;outline-offset:3px}

/* Sky: gradient + sun/moon glow, then particle canvas on top */
#sky{position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(120vmax 70vmax at 85% -10%, var(--glow), transparent 55%),
    linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 100%);
  transition:background 1.2s ease}
#fx{position:fixed;inset:0;z-index:-1;pointer-events:none;width:100%;height:100%}
#flash{position:fixed;inset:0;z-index:-1;background:#fff;opacity:0;pointer-events:none}

main{max-width:560px;margin:0 auto;padding:18px 16px 48px}

/* Header */
.top{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:15px;color:var(--soft)}
.refresh{display:flex;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--glass-edge);color:#fff;
  border-radius:999px;padding:7px 13px;font:600 13px/1 var(--body);cursor:pointer;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.refresh svg{width:14px;height:14px}
.refresh.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Hero weather */
.hero{margin:26px 0 18px;text-shadow:0 2px 24px rgba(0,0,0,.18)}
.temp{font:600 clamp(120px,36vw,168px)/.78 var(--num);letter-spacing:-.03em;margin:0}
.cond{font:700 30px/1.1 var(--body);letter-spacing:-.02em;margin:14px 0 4px}
.meta{color:var(--soft);font-size:15px}
.line{margin-top:10px;font-size:16px;font-weight:600}

.hero-row{display:flex;gap:14px;align-items:flex-start}
.hero-row.has-agenda .temp{font-size:clamp(84px,24vw,150px)}
.agenda{flex:1;min-width:0;max-width:240px;margin-left:auto;padding:12px 12px 10px;border-radius:20px;margin-top:4px;text-shadow:none}
.cal-h{display:flex;justify-content:space-between;align-items:baseline;font:700 13px/1 var(--body);margin:0 2px 8px}
.cal-h span{font-size:11px;color:var(--soft);font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px;text-align:center}
.cal b{font:700 10px/1.6 var(--body);color:var(--faint)}
.cal-d{position:relative;font:600 12px/24px var(--body);height:27px;color:var(--soft)}
.cal-d.past{color:var(--faint)}
.cal-d.today span{display:inline-block;width:23px;height:23px;line-height:23px;border-radius:50%;background:#fff;color:#0E1B2C;font-weight:800}
.cal-d.hol span{color:var(--warn);font-weight:800}
.cal-dots{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:2px}
.cal-dots i{width:4px;height:4px;border-radius:50%}
.cal-up{margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
.up-row{display:flex;align-items:center;gap:7px;padding:3px 0;font-size:12px;line-height:1.25;min-width:0}
.up-d{font:600 13px/1 var(--num);color:var(--soft);min-width:38px;flex:none}
.up-row .logo-sm{width:16px;height:16px;padding:1px}
.up-row .hdot{width:16px;height:16px;border-radius:50%;background:rgba(255,211,110,.25);color:var(--warn);font:800 10px/16px var(--body);text-align:center;flex:none}
.up-row span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

/* Glass panels */
.glass{background:var(--glass);border:1px solid var(--glass-edge);border-radius:24px;
  -webkit-backdrop-filter:blur(20px) saturate(150%);backdrop-filter:blur(20px) saturate(150%);
  box-shadow:0 10px 40px -18px rgba(0,0,0,.35)}

.hours{display:flex;overflow-x:auto;scrollbar-width:none;padding:14px 8px}
.hours::-webkit-scrollbar{display:none}
.hr{flex:0 0 54px;text-align:center}
.hr-t{font-size:12px;color:var(--soft);font-weight:600}
.hr-temp{font:600 22px/1.4 var(--num)}
.hr-p{height:18px;font-size:11px;font-weight:700;color:#BFE3FF}
.hr-p i{display:block;margin:2px auto 0;width:22px;height:3px;border-radius:2px;background:#BFE3FF}

h2{font:700 13px/1 var(--body);letter-spacing:.06em;color:var(--soft);margin:32px 4px 12px}

/* Commute tiles */
.commute{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{padding:16px 16px 14px;min-width:0}
.tile.wide{grid-column:1 / -1}
.tile:not(.wide) .t-name{white-space:normal;font-size:15px}
.tile:not(.wide) .near-row{font-size:13px}
.t-label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--soft);font-weight:600}
.t-label svg{width:16px;height:16px;flex:none}
.t-name{font:700 17px/1.2 var(--body);margin:4px 0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nums{display:flex;gap:26px;align-items:flex-end}
.n{font:700 72px/.8 var(--num)}
.n-sm{font:700 52px/.8 var(--num)}
.n-l{font-size:13px;color:var(--soft);margin-top:8px;font-weight:600}
.unit{font:600 15px/1 var(--body);color:var(--soft);margin-left:3px}
.near{margin-top:12px;border-top:1px solid var(--line);padding-top:6px}
.near-row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:14px;align-items:baseline}
.near-name{display:flex;gap:6px;min-width:0;align-items:baseline}
.near-name span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.near-name small{color:var(--faint);font-size:12px;white-space:nowrap}
.near-val{font:700 18px/1 var(--num);white-space:nowrap}
.good{color:var(--good)} .warn{color:var(--warn)} .bad{color:var(--bad)} .dim{color:var(--faint)}
.bus-next{display:flex;gap:16px;margin-top:10px;font:700 22px/1 var(--num);color:var(--soft)}
.bus-sub{font-size:12px;color:var(--soft);margin-top:6px;font-weight:600}

/* Markets */
.coins{padding:4px 16px}
.coin{display:grid;grid-template-columns:34px 1fr 76px auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.coin:last-child{border-bottom:0}
.coin img{width:34px;height:34px;border-radius:50%;background:#fff}
.c-sym{font:700 16px/1.1 var(--body)}
.c-name{font-size:12px;color:var(--soft)}
.spark{width:76px;height:30px}
.c-right{text-align:right}
.c-price{font:700 21px/1 var(--num)}
.pill{display:inline-block;margin-top:5px;padding:3px 8px;border-radius:999px;font:700 12px/1 var(--body)}
.pill.up{background:rgba(108,240,168,.18);color:var(--good)}
.pill.down{background:rgba(255,122,122,.18);color:var(--bad)}

/* Teams */
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team{padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.t-head{display:flex;align-items:center;gap:10px}
.logo{width:44px;height:44px;border-radius:50%;background:#fff;padding:6px;flex:none;object-fit:contain}
.logo-sm{width:22px;height:22px;border-radius:50%;background:#fff;padding:2px;object-fit:contain;flex:none}
.t-team{font:700 15px/1.15 var(--body)}
.t-league{font-size:11px;color:var(--soft);font-weight:700;letter-spacing:.05em}
.res{display:flex;align-items:center;gap:8px}
.wl{font:700 15px/1 var(--body);width:26px;height:26px;border-radius:8px;display:grid;place-items:center}
.wl.w{background:rgba(108,240,168,.2);color:var(--good)}
.wl.l{background:rgba(255,122,122,.2);color:var(--bad)}
.wl.live{background:var(--bad);color:#fff;width:auto;padding:0 7px;font-size:11px;letter-spacing:.05em}
.score{font:700 26px/1 var(--num)}
.when{font-size:12px;color:var(--soft);font-weight:600}
.next{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--soft);font-weight:600;border-top:1px solid var(--line);padding-top:10px}

/* Morning thought */
.thought{margin:22px 2px 6px}
.q{font:400 italic clamp(24px,6.6vw,30px)/1.22 "Instrument Serif",Georgia,serif;margin:0;letter-spacing:-.005em;text-wrap:pretty}
.q-by{margin-top:10px;font-size:13px;font-weight:600;color:var(--soft)}
.q-by a{color:var(--soft);text-underline-offset:3px}

/* Unlock button */
.unlock{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;padding:13px;border-radius:16px;
  background:#fff;color:#0E1B2C;font:700 15px/1 var(--body);text-decoration:none}
.unlock svg{width:18px;height:18px}
.unlock:active{transform:scale(.98)}

/* On this day */
.fact{display:grid;grid-template-columns:1fr auto;gap:14px;padding:16px;align-items:start}
.f-year{font:700 34px/.9 var(--num)}
.f-text{margin:8px 0 12px;font-size:15px;line-height:1.45}
.f-link{display:inline-flex;align-items:center;gap:6px;color:#fff;font:700 13px/1 var(--body);text-decoration:none;
  border:1px solid var(--glass-edge);border-radius:999px;padding:8px 12px}
.f-img{width:84px;height:84px;border-radius:16px;object-fit:cover;background:var(--glass)}

.msg{color:var(--soft);font-size:14px;padding:6px 0}
.msg a{color:#fff}
.skel{opacity:.5}
footer{margin-top:28px;text-align:center;font-size:12px;color:var(--faint)}

@media (max-width:360px){ .teams{grid-template-columns:1fr} .n{font-size:60px} }
@media (prefers-reduced-motion:reduce){ #sky{transition:none} .refresh.spin svg{animation:none} }
</style>
</head>
<body>
<div id="sky"></div>
<div id="flash"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<main>
  <div class="top">
    <span id="date"></span>
    <button class="refresh" id="refresh" type="button" aria-label="Refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg>
      <span id="updated">Refresh</span>
    </button>
  </div>

  <section class="thought" id="thought" hidden></section>

  <section class="hero">
    <div class="hero-row" id="heroRow">
      <div id="wxTemp"><p class="temp skel">--°</p></div>
      <aside class="glass agenda" id="agenda" hidden></aside>
    </div>
    <div id="wx" aria-live="polite"></div>
  </section>
  <div class="glass hours" id="hours" aria-label="Next hours"></div>

  <h2>COMMUTE</h2>
  <div class="commute">
    <div class="glass tile wide" id="home"><div class="msg">Checking your stop…</div></div>
    <div class="glass tile" id="bus"><div class="msg">Checking the bus…</div></div>
    <div class="glass tile" id="work"><div class="msg">Checking docks…</div></div>
  </div>

  <h2>MARKETS · 7 DAYS</h2>
  <div class="glass coins" id="coins"><div class="msg">Loading prices…</div></div>

  <h2>YOUR TEAMS</h2>
  <div class="teams" id="teams"><div class="msg">Loading scores…</div></div>

  <div id="factWrap" hidden>
    <h2>ON THIS DAY</h2>
    <div class="glass fact" id="fact"></div>
  </div>

  <footer>Quotes Wikiquote · History Wikipedia · Holidays Nager.Date · Weather Open-Meteo · Bikes Citi Bike · Bus MTA · Prices CoinGecko · Scores ESPN</footer>
</main>

<script>
/* =====================================================================
   CONFIG — edit these to change what the page shows.
   Preview any weather theme by adding ?wx=rain (or clear, night,
   cloudy, overcast, fog, snow, storm) to the page address.
   ===================================================================== */
const CONFIG = {
  weather: { lat: 40.69146, lon: -73.92146 },

  // Station matched by name words first; coordinates are the fallback.
  home: { label: "Bikes at home", words: ["bushwick", "linden"], lat: 40.69146, lon: -73.92146, nearby: 2 },
  work: { label: "Docks at work", words: ["clifton", "bedford"], lat: 40.6875, lon: -73.9540, nearby: 2,
          alts: [["greene", "nostrand"], ["bedford", "monroe"]] },

  // MTA bus. relay = your Cloudflare Worker URL (keeps the key private;
  // stopId required). Or skip the relay and fill key instead.
  bus: { relay: "https://bus-relay.daniele-caccavella.workers.dev", key: "", stopId: "304201", route: "B52", label: "B52 downtown",
         stopName: "Gates Ave & Bushwick Ave",
         stopWords: ["gates", "bushwick"], lat: 40.69146, lon: -73.92146,
         towards: /downtown|cadman|tillary|jay st/i },

  // Unlock link: the Citi Bike system's own scan-to-unlock link (from its live feed).
  unlockUrl: "https://bkn.lft.to/lastmile_qr_scan",

  // Daily thought: one author per day, quote pulled from their Wikiquote page.
  quoteAuthors: [
    { name: "Alan Watts",    page: "Alan_Watts" },
    { name: "Ram Dass",      page: "Ram_Dass" },
    { name: "Deepak Chopra", page: "Deepak_Chopra" },
  ],


  coins: ["bitcoin", "ethereum", "solana", "zcash", "chainlink"],

  teams: [
    { name: "Maple Leafs", short: "Leafs", color: "#4D7CFE", league: "NHL",  path: "hockey/nhl/teams/tor",
      logo: "https://a.espncdn.com/i/teamlogos/nhl/500/tor.png" },
    { name: "Raptors", short: "Raptors", color: "#FF5A5F",     league: "NBA",  path: "basketball/nba/teams/tor",
      logo: "https://a.espncdn.com/i/teamlogos/nba/500/tor.png" },
    { name: "Blue Jays", short: "Jays", color: "#7FD1FF",   league: "MLB",  path: "baseball/mlb/teams/tor",
      logo: "https://a.espncdn.com/i/teamlogos/mlb/500/tor.png" },
    { name: "Friars", short: "Friars", color: "#F2F2F2",      league: "NCAAM", path: "basketball/mens-college-basketball/teams/2507",
      logo: "https://a.espncdn.com/i/teamlogos/ncaa/500/2507.png" },
  ],
};
/* ===================================================================== */

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const getJSON = async url => { const r = await fetch(url, {cache:"no-store"}); if (!r.ok) throw new Error(r.status); return r.json(); };
const tz = "America/New_York";
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

const ICON = {
  bike: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="17" r="3.5"/><circle cx="18.5" cy="17" r="3.5"/><path d="M5.5 17 9 9h6l3.5 8M9 9 12 17h-3M14 6h2"/></svg>',
  bus:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="15" rx="3"/><path d="M4 11h16M8 21v-3M16 21v-3"/><circle cx="8" cy="14.5" r=".6" fill="currentColor"/><circle cx="16" cy="14.5" r=".6" fill="currentColor"/></svg>',
  scan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/></svg>',
  dock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',
};

/* ---------- Sky themes ---------- */
const THEMES = {
  clear:    { sky1:"#1F5BC4", sky2:"#4F97DD", glow:"rgba(255,214,110,.60)", fx:"none" },
  cloudy:   { sky1:"#3A679E", sky2:"#7C9CBD", glow:"rgba(255,230,170,.35)", fx:"clouds" },
  overcast: { sky1:"#4C5A6B", sky2:"#8995A3", glow:"rgba(255,255,255,.10)", fx:"clouds" },
  fog:      { sky1:"#526274", sky2:"#7F8E9C", glow:"rgba(255,255,255,.25)", fx:"fog" },
  rain:     { sky1:"#1F3247", sky2:"#3F6688", glow:"rgba(160,200,255,.18)", fx:"rain" },
  storm:    { sky1:"#0F1724", sky2:"#2B3A52", glow:"rgba(150,120,255,.20)", fx:"storm" },
  snow:     { sky1:"#48668F", sky2:"#8AA6C6", glow:"rgba(255,255,255,.35)", fx:"snow" },
  night:    { sky1:"#070B1E", sky2:"#23305C", glow:"rgba(160,180,255,.22)", fx:"stars" },
  nightcloud:{ sky1:"#121827", sky2:"#34405A", glow:"rgba(160,180,255,.10)", fx:"clouds" },
};
const themeFor = (code, isDay) => {
  if ([95,96,99].includes(code)) return "storm";
  if ([71,73,75,77,85,86].includes(code)) return "snow";
  if ([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)) return "rain";
  if ([45,48].includes(code)) return "fog";
  if (!isDay) return code <= 1 ? "night" : "nightcloud";
  if (code <= 1) return "clear";
  if (code === 2) return "cloudy";
  return "overcast";
};
function applyTheme(name){
  const t = THEMES[name] || THEMES.clear, r = document.documentElement.style;
  r.setProperty("--sky1", t.sky1); r.setProperty("--sky2", t.sky2); r.setProperty("--glow", t.glow);
  document.querySelector('meta[name="theme-color"]').content = t.sky1;
  startFx(t.fx);
}

/* ---------- Weather particles ---------- */
const cv = $("fx"), cx = cv.getContext("2d");
let fxRaf = 0, fxKind = "", parts = [], W = 0, H = 0;
function sizeCanvas(){ const d = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = W*d; cv.height = H*d; cx.setTransform(d,0,0,d,0,0); }
function startFx(kind){
  if (kind === fxKind) return; fxKind = kind; cancelAnimationFrame(fxRaf); sizeCanvas(); cx.clearRect(0,0,W,H);
  if (kind === "none") return;
  const area = W*H/10000, R = Math.random;
  if (kind === "rain" || kind === "storm") parts = Array.from({length: Math.round(area*(kind==="storm"?2.2:1.6))}, () => ({x:R()*W, y:R()*H, l:10+R()*16, v:9+R()*8}));
  if (kind === "snow") parts = Array.from({length: Math.round(area*.9)}, () => ({x:R()*W, y:R()*H, r:1+R()*2.6, v:.4+R()*1.1, p:R()*6.28}));
  if (kind === "stars") parts = Array.from({length: Math.round(area*1.1)}, () => ({x:R()*W, y:R()*H*.75, r:R()*1.3+.3, p:R()*6.28}));
  if (kind === "clouds" || kind === "fog") parts = Array.from({length: kind==="fog"?7:5}, (_,i) => ({x:R()*W, y:(kind==="fog"? H*.3 : 0)+R()*H*(kind==="fog"?.7:.45), r:140+R()*180, v:.08+R()*.15}));
  if (reduceMotion){ draw(0); return; }
  const loop = t => { draw(t); fxRaf = requestAnimationFrame(loop); }; fxRaf = requestAnimationFrame(loop);
}
function draw(t){
  cx.clearRect(0,0,W,H);
  if (fxKind === "rain" || fxKind === "storm"){
    cx.strokeStyle = "rgba(200,225,255,.42)"; cx.lineWidth = 1.2; cx.beginPath();
    for (const p of parts){ cx.moveTo(p.x,p.y); cx.lineTo(p.x-p.l*.18,p.y+p.l); p.y += p.v; p.x -= p.v*.18;
      if (p.y > H){ p.y = -20; p.x = Math.random()*W*1.1; } }
    cx.stroke();
    if (fxKind === "storm" && !reduceMotion && Math.random() < .004) flash();
  } else if (fxKind === "snow"){
    cx.fillStyle = "rgba(255,255,255,.85)";
    for (const p of parts){ cx.beginPath(); cx.arc(p.x + Math.sin(t/1400+p.p)*14, p.y, p.r, 0, 6.28); cx.fill();
      p.y += p.v; if (p.y > H+5){ p.y = -5; p.x = Math.random()*W; } }
  } else if (fxKind === "stars"){
    for (const p of parts){ cx.globalAlpha = .35 + .5*Math.abs(Math.sin(t/1800+p.p));
      cx.fillStyle = "#fff"; cx.beginPath(); cx.arc(p.x,p.y,p.r,0,6.28); cx.fill(); }
    cx.globalAlpha = 1;
  } else if (fxKind === "clouds" || fxKind === "fog"){
    for (const p of parts){ const g = cx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);
      const a = fxKind === "fog" ? .16 : .13; g.addColorStop(0,`rgba(255,255,255,${a})`); g.addColorStop(1,"rgba(255,255,255,0)");
      cx.fillStyle = g; cx.fillRect(p.x-p.r,p.y-p.r,p.r*2,p.r*2);
      p.x += p.v; if (p.x - p.r > W) p.x = -p.r; }
  }
}
function flash(){ const f = $("flash"); f.animate([{opacity:0},{opacity:.35},{opacity:0},{opacity:.2},{opacity:0}],{duration:700}); }
addEventListener("resize", () => { const k = fxKind; fxKind = ""; startFx(k); });
document.addEventListener("visibilitychange", () => { if (document.hidden) cancelAnimationFrame(fxRaf); else { const k = fxKind; fxKind = ""; startFx(k); } });

/* ---------- Citi Bike (GBFS) ---------- */
const meters = (a,b,c,d) => { const R=6371e3, r=x=>x*Math.PI/180, dl=r(c-a), dn=r(d-b);
  const x=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2; return 2*R*Math.asin(Math.sqrt(x)); };
const walk = m => `${Math.max(1,Math.round(m/80))} min walk`;
const tone = n => n === 0 ? "bad" : n <= 3 ? "warn" : "good";

async function loadBikes(){
  const [info, status] = await Promise.all([
    getJSON("https://gbfs.citibikenyc.com/gbfs/en/station_information.json"),
    getJSON("https://gbfs.citibikenyc.com/gbfs/en/station_status.json"),
  ]);
  const st = new Map(status.data.stations.map(s => [s.station_id, s]));
  const all = info.data.stations.map(s => ({...s, ...(st.get(s.station_id)||{})}));
  const pick = cfg => {
    const named = all.find(s => cfg.words.every(w => s.name.toLowerCase().includes(w)));
    const a = named || cfg;
    const ranked = all.map(s => ({...s, dist: meters(a.lat, a.lon, s.lat, s.lon)})).sort((x,y) => x.dist - y.dist);
    const primary = named ? ranked.find(s => s.station_id === named.station_id) : ranked[0];
    return { primary, rest: ranked.filter(s => s !== primary) };
  };
  const split = s => { const e = s.num_ebikes_available ?? 0; return { e, c: Math.max(0,(s.num_bikes_available ?? 0) - e) }; };

  const h = pick(CONFIG.home), hp = h.primary, hb = split(hp);
  $("home").innerHTML = `<div class="t-label">${ICON.bike}${esc(CONFIG.home.label)}</div>
    <div class="t-name">${esc(hp.name)}</div>
    ${hp.is_renting === 0 ? `<p class="msg bad">Not renting right now.</p>` :
    `<div class="nums"><div><div class="n ${tone(hb.c)}">${hb.c}</div><div class="n-l">classic</div></div>
      <div><div class="n ${tone(hb.e)}">${hb.e}</div><div class="n-l">e-bikes</div></div></div>`}
    <div class="near">${h.rest.slice(0, CONFIG.home.nearby).map(s => { const b = split(s);
      return `<div class="near-row"><span class="near-name"><span>${esc(s.name)}</span><small>${walk(s.dist)}</small></span>
        <span class="near-val"><span class="${tone(b.c)}">${b.c}</span> <span class="dim">·</span> <span class="${tone(b.e)}">${b.e}⚡</span></span></div>`; }).join("")}</div>
    <a class="unlock" href="${esc(CONFIG.unlockUrl)}">${ICON.scan}Scan to unlock</a>`;

  const w = pick(CONFIG.work), wp = w.primary;
  // Named backups first, then nearest stations to fill any that aren't found
  const named = (CONFIG.work.alts || []).map(ws => w.rest.find(s => ws.every(x => s.name.toLowerCase().includes(x)))).filter(Boolean);
  const backups = [...named, ...w.rest.filter(s => !named.includes(s))].slice(0, CONFIG.work.nearby);
  const docks = s => s.is_returning === 0 ? 0 : (s.num_docks_available ?? 0);
  $("work").innerHTML = `<div class="t-label">${ICON.dock}${esc(CONFIG.work.label)}</div>
    <div class="t-name">${esc(wp.name)}</div>
    <div class="n-sm ${tone(docks(wp))}">${docks(wp)}<span class="unit">open</span></div>
    <div class="near">${backups.map(s =>
      `<div class="near-row"><span class="near-name"><span>${esc(s.name.replace(/ (Ave|St|Pl|Blvd|Rd|Pkwy)\b/g, ""))}</span></span>
       <span class="near-val ${tone(docks(s))}">${docks(s)}</span></div>`).join("")}</div>`;
}

/* ---------- MTA bus ---------- */
const stripId = s => String(s.code || s.id).replace(/^MTA_/, "");
async function busVisits(stopId){
  const b = CONFIG.bus;
  const u = b.relay ? `${b.relay.replace(/\/$/,"")}/?stop=${encodeURIComponent(stopId)}&line=${encodeURIComponent(b.route)}`
    : `https://bustime.mta.info/api/siri/stop-monitoring.json?key=${encodeURIComponent(b.key)}&version=2`+
      `&OperatorRef=MTA&MonitoringRef=${stopId}&LineRef=${encodeURIComponent("MTA NYCT_"+b.route)}&MaximumStopVisits=6`;
  const d = await getJSON(u);
  return d.Siri?.ServiceDelivery?.StopMonitoringDelivery?.[0]?.MonitoredStopVisit || [];
}
async function findBusStop(){
  const b = CONFIG.bus;
  if (b.stopId) return b.stopId;
  try { const c = localStorage.getItem("busStop:"+b.route); if (c) return c; } catch(e){}
  const d = await getJSON(`https://bustime.mta.info/api/where/stops-for-location.json?lat=${b.lat}&lon=${b.lon}&latSpan=0.012&lonSpan=0.012&key=${encodeURIComponent(b.key)}`);
  const stops = d.data?.stops || d.data?.list || [];
  const cands = stops.filter(s => (s.routes||[]).some(r => (r.shortName||r.id||"").toUpperCase().endsWith(b.route))
    && b.stopWords.every(w => (s.name||"").toLowerCase().includes(w)));
  if (!cands.length) throw new Error("stop not found");
  for (const s of cands){
    const v = await busVisits(stripId(s)).catch(() => []);
    if (!v.length || v.some(x => b.towards.test(x.MonitoredVehicleJourney?.DestinationName || ""))){
      try { localStorage.setItem("busStop:"+b.route, stripId(s)); } catch(e){}
      return stripId(s);
    }
  }
  return stripId(cands[0]);
}
async function loadBus(){
  const b = CONFIG.bus, el = $("bus");
  const head = `<div class="t-label">${ICON.bus}${esc(b.label)}</div><div class="t-name">${esc(b.stopName)}</div>`;
  if (!b.relay && !b.key){ el.innerHTML = head + `<p class="msg">Add a relay or key in settings.</p>`; return; }
  if (b.relay && !b.stopId){ el.innerHTML = head + `<p class="msg">Add the stop code in settings.</p>`; return; }
  const v = (await busVisits(await findBusStop())).filter(x => b.towards.test(x.MonitoredVehicleJourney?.DestinationName || ""));
  const rows = v.slice(0,3).map(x => { const c = x.MonitoredVehicleJourney.MonitoredCall || {};
    const t = c.ExpectedArrivalTime || c.AimedArrivalTime;
    return { mins: t ? Math.max(0, Math.round((new Date(t) - Date.now())/60000)) : null,
             away: c.ArrivalProximityText || c.Extensions?.Distances?.PresentableDistance || "" }; });
  if (!rows.length){ el.innerHTML = head + `<p class="msg">No downtown buses tracked right now.</p>`; return; }
  const [f, ...more] = rows;
  el.innerHTML = head + `<div class="n-sm">${f.mins ?? "–"}<span class="unit">min</span></div>
    <div class="bus-sub">${esc(f.away)}</div>
    ${more.length ? `<div class="bus-next">${more.map(r => `<span>${r.mins ?? "–"}<span class="unit">min</span></span>`).join("")}</div>` : ""}`;
}

const usd = n => n >= 1000 ? "$" + n.toLocaleString("en-US",{maximumFractionDigits:0})

function spark(pts, up){
  if (!pts || pts.length < 2) return "";
  const step = Math.max(1, Math.floor(pts.length/60)), p = pts.filter((_,i) => i % step === 0);
  const mn = Math.min(...p), mx = Math.max(...p), rg = mx - mn || 1;
  const xy = p.map((v,i) => [ (i/(p.length-1))*76, 27 - ((v-mn)/rg)*24 ]);
  const d = xy.map((q,i) => (i?"L":"M") + q[0].toFixed(1) + " " + q[1].toFixed(1)).join("");
  const col = up ? "var(--good)" : "var(--bad)", id = "g" + Math.random().toString(36).slice(2,7);
  return `<svg class="spark" viewBox="0 0 76 30" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${up?"#6CF0A8":"#FF7A7A"}" stop-opacity=".35"/><stop offset="1" stop-color="${up?"#6CF0A8":"#FF7A7A"}" stop-opacity="0"/></linearGradient></defs>
    <path d="${d}L76 30L0 30Z" fill="url(#${id})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

/* ---------- Teams (ESPN) ---------- */
const dayKey = x => x.toLocaleDateString("en-US",{timeZone:tz});
const fmtDay = iso => { const d = new Date(iso), n = new Date(), y = new Date(n), t = new Date(n);
  y.setDate(n.getDate()-1); t.setDate(n.getDate()+1);
  if (dayKey(d) === dayKey(n)) return "Today"; if (dayKey(d) === dayKey(y)) return "Last night";
  if (dayKey(d) === dayKey(t)) return "Tomorrow";
  return d.toLocaleDateString("en-US",{timeZone:tz,weekday:"short",month:"short",day:"numeric"}); };
const fmtTime = iso => new Date(iso).toLocaleTimeString("en-US",{timeZone:tz,hour:"numeric",minute:"2-digit"});
const scoreOf = c => typeof c.score === "object" ? (c.score?.displayValue ?? c.score?.value) : c.score;
const logoOf = t => t?.logos?.[0]?.href || t?.logo || "";

async function loadTeam(t){
  const base = `https://site.api.espn.com/apis/site/v2/sports/${t.path}/schedule`;
  const res = await Promise.allSettled([1,2,3].map(n => getJSON(`${base}?seasontype=${n}`)).concat(getJSON(base)));
  const ok = res.filter(r => r.status === "fulfilled").map(r => r.value);
  if (!ok.length) throw new Error("no data");
  const myId = ok[0].team?.id, seen = new Map();
  ok.forEach(d => (d.events || []).forEach(e => seen.set(e.id, e)));
  const ev = [...seen.values()].sort((a,b) => new Date(a.date) - new Date(b.date));
  const st = e => e.competitions?.[0]?.status?.type?.state;
  const live = ev.find(e => st(e) === "in");
  const last = [...ev].reverse().find(e => st(e) === "post");
  const next = ev.find(e => st(e) === "pre" && new Date(e.date) > Date.now() - 3*3600e3);
  const sides = e => { const cs = e.competitions[0].competitors, me = cs.find(c => c.team?.id === myId) || cs[0], op = cs.find(c => c !== me);
    return { me, op, vs: me.homeAway === "home" ? "vs" : "@", opp: op?.team?.abbreviation || op?.team?.shortDisplayName || "", ologo: logoOf(op?.team) }; };

  let resHTML = `<div class="when">No recent games</div>`;
  if (live){ const s = sides(live);
    resHTML = `<div class="res"><span class="wl live">LIVE</span><span class="score">${esc(scoreOf(s.me))}–${esc(scoreOf(s.op))}</span></div>
      <div class="when">${s.vs} ${esc(s.opp)}</div>`; }
  else if (last){ const s = sides(last), won = s.me.winner === true;
    resHTML = `<div class="res"><span class="wl ${won?"w":"l"}">${won?"W":"L"}</span><span class="score">${esc(scoreOf(s.me))}–${esc(scoreOf(s.op))}</span></div>
      <div class="when">${s.vs} ${esc(s.opp)} · ${fmtDay(last.date)}</div>`; }
  let nextHTML = live ? "" : `<div class="next">Nothing scheduled</div>`;
  if (next){ const s = sides(next);
    nextHTML = `<div class="next">${s.ologo ? `<img class="logo-sm" src="${esc(s.ologo)}" alt="">` : ""}<span>${s.vs} ${esc(s.opp)} · ${fmtDay(next.date)} ${fmtTime(next.date)}</span></div>`; }
  const games = ev.map(e => { const s = sides(e); return { date: e.date, vs: s.vs, opp: s.opp, ologo: s.ologo }; });
  return { logo: ok[0].team?.logo || logoOf(ok[0].team) || t.logo, html: `<div>${resHTML}</div>${nextHTML}`, games };
}

      <div><div class="t-team">${esc(t.name)}</div><div class="t-league">${esc(t.league)}</div></div></div>

/* ---------- Daily thought (Wikiquote) & On this day (Wikipedia) ---------- */
const todayKey = () => new Date().toLocaleDateString("en-CA",{timeZone:tz});          // 2026-10-01
const dayNum = () => Math.floor(Date.parse(todayKey()+"T00:00:00Z")/864e5);
const pickIdx = (n, salt) => (Math.imul(dayNum()+salt, 2654435761) >>> 0) % n;
const cacheGet = k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch(e){ return null; } };
const cacheSet = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };

async function loadThought(){
  const key = "thought:" + todayKey();
  let q = cacheGet(key);
  if (!q){
    const a = CONFIG.quoteAuthors[dayNum() % CONFIG.quoteAuthors.length];
    const d = await getJSON(`https://en.wikiquote.org/w/api.php?action=parse&page=${a.page}&prop=text&format=json&formatversion=2&origin=*`);
    const doc = new DOMParser().parseFromString(d.parse.text, "text/html");
    const root = doc.querySelector(".mw-parser-output") || doc.body;
    const skip = /disputed|misattributed|about|external|see also|sources|references|notes/i;
    let section = "", quotes = [];
    for (const el of root.children){
      const h2 = el.matches("h2") ? el : el.querySelector(":scope > h2");
      if (h2){ section = h2.textContent; continue; }
      if (el.tagName !== "UL" || skip.test(section)) continue;
      for (const li of el.querySelectorAll(":scope > li")){
        const c = li.cloneNode(true); c.querySelectorAll("ul, sup, .reference").forEach(n => n.remove());
        const t = c.textContent.replace(/\s+/g," ").trim();
        if (t.length >= 40 && t.length <= 280) quotes.push(t);
      }
    }
    if (!quotes.length) throw new Error("no quotes");
    q = { text: quotes[pickIdx(quotes.length, 3)], by: a.name, url: `https://en.m.wikiquote.org/wiki/${a.page}` };
    cacheSet(key, q);
  }
  const el = $("thought");
  el.innerHTML = `<p class="q">“${esc(q.text.replace(/^["“]|["”]$/g,""))}”</p>
    <div class="q-by">${esc(q.by)} · <a href="${esc(q.url)}">more</a></div>`;
  el.hidden = false;
}

async function loadFact(){
  const key = "fact:" + todayKey();
  let f = cacheGet(key);
  if (!f){
    const [mm, dd] = todayKey().slice(5).split("-");
    const d = await getJSON(`https://en.wikipedia.org/api/rest_v1/feed/onthisday/events/${mm}/${dd}`);
    const ev = (d.events || []).filter(e => e.pages?.[0]?.content_urls && e.text);
    if (!ev.length) throw new Error("no events");
    const e = ev[pickIdx(ev.length, 11)], pg = e.pages[0];
    f = { year: e.year, text: e.text, url: pg.content_urls.mobile?.page || pg.content_urls.desktop?.page,
          title: pg.titles?.normalized || pg.title || "", img: pg.thumbnail?.source || "" };
    cacheSet(key, f);
  }
  $("fact").innerHTML = `<div><div class="f-year">${esc(f.year)}</div><p class="f-text">${esc(f.text)}</p>
    <a class="f-link" href="${esc(f.url)}">Read more on Wikipedia</a></div>
    ${f.img ? `<img class="f-img" src="${esc(f.img)}" alt="">` : ""}`;
  $("factWrap").hidden = false;
}

/* ---------- Month calendar: holidays, observances, your teams' games ---------- */
const nthDow = (y, m, dow, n) => { const d = new Date(Date.UTC(y, m, 1)); const off = (dow - d.getUTCDay() + 7) % 7; return 1 + off + (n-1)*7; };
function observances(y, m){
  const list = [
    [1, 14, "Valentine's Day"], [2, 17, "St. Patrick's Day"], [9, 31, "Halloween"],
    [11, 24, "Christmas Eve"], [11, 31, "New Year's Eve"],
    [2, nthDow(y,2,0,2), "Clocks spring forward"], [10, nthDow(y,10,0,1), "Clocks fall back"],
    [4, nthDow(y,4,0,2), "Mother's Day"], [5, nthDow(y,5,0,3), "Father's Day"],
  ];
  return list.filter(o => o[0] === m).map(o => ({ day: o[1], name: o[2] }));
}
async function holidays(y){
  const key = "holidays:" + y; let h = cacheGet(key);
  if (!h){
    const d = await getJSON(`https://date.nager.at/api/v3/PublicHolidays/${y}/US`);
    h = d.filter(x => x.global || (x.counties || []).includes("US-NY")).map(x => ({ date: x.date, name: x.name }));
    cacheSet(key, h);
  }
  return h;
}
async function loadMonth(teamsP){
  const [y, mo, dd] = todayKey().split("-").map(Number), m = mo - 1;
  const hol = await holidays(y).catch(() => []);
  const marks = {};   // day -> { hol: [names], games: [{team, color, ...}] }
  const at = d => marks[d] || (marks[d] = { hol: [], games: [] });
  hol.filter(h => +h.date.slice(5,7) === mo).forEach(h => at(+h.date.slice(8,10)).hol.push(h.name));
  observances(y, m).forEach(o => at(o.day).hol.push(o.name));

  const upcoming = [];
  const teams = await teamsP;
  teams.forEach((r, i) => { if (r.status !== "fulfilled") return; const t = CONFIG.teams[i];
    r.value.games.forEach(g => {
      const k = new Date(g.date).toLocaleDateString("en-CA",{timeZone:tz});
      const gy = +k.slice(0,4), gm = +k.slice(5,7), gd = +k.slice(8,10);
      if (gy === y && gm === mo) at(gd).games.push({ color: t.color });
      if (k >= todayKey()) upcoming.push({ key: k, at: g.date, logo: g.ologo, text: `${t.short || t.name} ${g.vs} ${g.opp}` });
    }); });
  hol.forEach(h => { if (h.date >= todayKey()) upcoming.push({ key: h.date, hol: true, text: h.name }); });
  for (const mm of [m, (m+1) % 12]) observances(mm < m ? y+1 : y, mm).forEach(o => {
    const k = `${mm < m ? y+1 : y}-${String(mm+1).padStart(2,"0")}-${String(o.day).padStart(2,"0")}`;
    if (k >= todayKey()) upcoming.push({ key: k, hol: true, text: o.name }); });
  upcoming.sort((a,b) => a.key.localeCompare(b.key) || (a.hol ? -1 : 1));

  const first = new Date(Date.UTC(y, m, 1)).getUTCDay(), days = new Date(Date.UTC(y, m+1, 0)).getUTCDate();
  const monthName = new Date(Date.UTC(y, m, 15)).toLocaleDateString("en-US",{month:"long",timeZone:"UTC"});
  let cells = ["S","M","T","W","T","F","S"].map(d => `<b>${d}</b>`).join("");
  for (let i = 0; i < first; i++) cells += `<div></div>`;
  for (let d = 1; d <= days; d++){
    const mk = marks[d], cls = ["cal-d", d < dd ? "past" : "", d === dd ? "today" : "", mk?.hol.length ? "hol" : ""].join(" ");
    const dots = mk?.games.length ? `<div class="cal-dots">${mk.games.slice(0,3).map(g => `<i style="background:${g.color}"></i>`).join("")}</div>` : "";
    const title = mk ? [...mk.hol, ...(mk.games.length ? [`${mk.games.length} game${mk.games.length>1?"s":""}`] : [])].join(", ") : "";
    cells += `<div class="${cls}"${title ? ` title="${esc(title)}"` : ""}><span>${d}</span>${dots}</div>`;
  }
  const short = k => new Date(k + "T12:00:00Z").toLocaleDateString("en-US",{month:"short",day:"numeric",timeZone:"UTC"});
  // Next two items, plus the next holiday if it isn't already among them
  let pickUp = upcoming.slice(0, 2); const nh = upcoming.find(u => u.hol);
  if (nh && !pickUp.includes(nh)) pickUp.push(nh); else pickUp = upcoming.slice(0, 3);
  pickUp.sort((a,b) => a.key.localeCompare(b.key));
  const up = pickUp.map(u => `<div class="up-row"><span class="up-d">${short(u.key)}</span>${
      u.hol ? `<span class="hdot">★</span>` : u.logo ? `<img class="logo-sm" src="${esc(u.logo)}" alt="">` : ""}<span>${esc(u.text)}</span></div>`).join("");
  $("agenda").innerHTML = `<div class="cal-h">${esc(monthName)}<span>${y}</span></div><div class="cal">${cells}</div>${up ? `<div class="cal-up">${up}</div>` : ""}`;
  $("agenda").hidden = false; $("heroRow").classList.add("has-agenda");
}

/* ---------- Run ---------- */
const fail = (id, html) => () => { $(id).innerHTML = html; };
let busy = false, lastLoad = 0;
async function loadAll(){
  if (busy) return; busy = true; lastLoad = Date.now(); $("refresh").classList.add("spin");
  $("date").textContent = new Date().toLocaleDateString("en-US",{timeZone:tz,weekday:"long",month:"long",day:"numeric"});
  const teamsP = Promise.allSettled(CONFIG.teams.map(loadTeam));
  await Promise.allSettled([
    loadWeather().catch(fail("wx", `<p class="msg">Weather didn't load. Tap refresh.</p>`)),
    loadBikes().catch(() => { $("home").innerHTML = `<p class="msg">Citi Bike didn't load. Tap refresh.</p>`; $("work").innerHTML = ""; }),
    loadBus().catch(e => { $("bus").innerHTML = `<div class="t-label">${ICON.bus}${esc(CONFIG.bus.label)}</div><p class="msg">Didn't load (${esc(e && e.message || "error")}). <a href="https://bustime.mta.info/m/?q=${CONFIG.bus.route}">Bus Time</a></p>`; }),
    loadCoins().catch(fail("coins", `<p class="msg">Prices didn't load. Tap refresh.</p>`)),
    loadTeams(teamsP),
    loadMonth(teamsP).catch(() => {}),
    loadThought().catch(() => {}),
    loadFact().catch(() => {}),
  ]);
  $("updated").textContent = new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
  $("refresh").classList.remove("spin"); busy = false;
}
// Sky before weather arrives: guess from the clock
(() => { const h = +new Date().toLocaleString("en-US",{timeZone:tz,hour:"numeric",hour12:false});
  const f = new URLSearchParams(location.search).get("wx"); applyTheme(f && THEMES[f] ? f : (h >= 7 && h < 19 ? "clear" : "night")); })();
$("refresh").addEventListener("click", loadAll);
document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - lastLoad > 60e3) loadAll(); });
loadAll();
</script>
